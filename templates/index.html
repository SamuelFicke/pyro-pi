<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140d08">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fireplace">
  <title>Fireplace</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="loading">
  <main class="card">
    <h1 class="title">Front Room Fireplace</h1>

    <div class="flame" aria-hidden="true">
      <div class="flame-glow"></div>
      <svg viewBox="0 0 64 80" class="flame-svg">
        <path class="f-outer" d="M32 2 C44 20 58 30 50 52 C46 66 38 72 32 78 C26 72 18 66 14 52 C6 30 20 20 32 2 Z"/>
        <path class="f-inner" d="M32 26 C40 36 44 44 40 56 C37 64 34 68 32 72 C30 68 27 64 24 56 C20 44 24 36 32 26 Z"/>
      </svg>
    </div>

    <div class="status">
      <div class="state" id="state">—</div>
      <div class="offline-note" id="offline-note" hidden>Can't reach the fireplace</div>
    </div>

    <div class="buttons">
      <button id="btn-on" class="btn btn-on">Turn On</button>
      <button id="btn-off" class="btn btn-off">Turn Off</button>
    </div>

    <section class="timer" id="timer" hidden>
      <div class="timer-label">Turn off at</div>
      <div class="wheel" id="wheel">
        <ul class="wheel-list" id="wheel-list"></ul>
        <div class="wheel-center" aria-hidden="true"></div>
        <div class="wheel-fade wheel-fade-top" aria-hidden="true"></div>
        <div class="wheel-fade wheel-fade-bottom" aria-hidden="true"></div>
      </div>
      <div class="timer-hint" id="ceiling-hint"></div>
    </section>

    <footer class="foot">
      <span id="clock">—</span>
    </footer>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
